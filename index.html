<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />

    <title>Burst: Tabata &amp; Interval Timer</title>

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Burst" />

    <meta
      property="og:description"
      content="Free offline Tabata and interval timer. Build custom work and rest workouts, drag to reorder, no sign-up. Your data stays on your device."
    />
    <meta property="og:url" content="https://burst.jurajhamran.com/" />
    <meta
      property="og:image"
      content="https://burst.jurajhamran.com/og-image.png"
    />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />

    />

    <link rel="canonical" href="https://burst.jurajhamran.com/" />

    <script>
      (function () {
        try {
          var raw = localStorage.getItem("tabata-theme");
          var t = raw ? JSON.parse(raw).state.theme : "system";
          var dark =
            t === "dark" ||
            (t !== "light" &&
              matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-surface overscroll-none">
    <div id="root"></div>
    <noscript>Burst needs JavaScript to run.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
